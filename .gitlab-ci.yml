stages:
  - test
  - release

default:
  image: python:3.11
  before_script:
    - python -V
    - python -m pip install --upgrade pip

test:
  stage: test
  script:
    - python -m pip install -e .
    - python -m unittest discover -s tests -p 'test_*.py' -q

release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - python -m pip install -e .
    - python -m pip install build
    - python -m build
  artifacts:
    when: always
    paths:
      - dist/
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: "rocs-cli release for $CI_COMMIT_TAG"

