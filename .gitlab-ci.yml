stages:
  - lint
  - typecheck
  - test
  - release

.uv_setup:
  before_script:
    - python -V
    - apt-get update
    - apt-get install -y curl
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - uv --version

lint:
  stage: lint
  image: python:3.11
  extends: .uv_setup
  script:
    - RUFF_VERSION=$(python -c 'import json; print(json.load(open("scripts/tool_versions.json"))["ruff"])')
    - uvx ruff==${RUFF_VERSION} --version
    - uvx ruff==${RUFF_VERSION} check .

typecheck:
  stage: typecheck
  image: python:3.11
  extends: .uv_setup
  script:
    - TY_VERSION=$(python -c 'import json; print(json.load(open("scripts/tool_versions.json"))["ty"])')
    - uv sync --frozen
    - uvx ty==${TY_VERSION} --version
    - uvx ty==${TY_VERSION} check src/rocs_cli

test:
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.11", "3.12", "3.13"]
  image: python:$PYTHON_VERSION
  extends: .uv_setup
  script:
    - uv sync --frozen
    - uv run python -m unittest discover -s tests -p 'test_*.py' -q

release:
  stage: release
  image: python:3.11
  extends: .uv_setup
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - uv sync --frozen
    - uv run --with build python -m build
  artifacts:
    when: always
    paths:
      - dist/
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: "rocs-cli release for $CI_COMMIT_TAG"
